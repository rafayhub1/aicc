    });
    canvas.addEventListener("pointerup", () => {
      canvas._drag = null;
      canvas.classList.remove("dragging");
    });
    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = event.clientX - rect.left;
      const my = event.clientY - rect.top;
      const next = Math.min(8, Math.max(0.15, scale * (event.deltaY < 0 ? 1.12 : 1 / 1.12)));
      const k = next / scale;
      panX = mx - (mx - panX) * k;
      panY = my - (my - panY) * k;
      scale = next;
      draw();
    }, { passive: false });

    document.getElementById("pitch").addEventListener("input", (event) => {
      pitch = Number(event.target.value) * Math.PI / 180;
      draw();
    });
    document.getElementById("yaw").addEventListener("input", (event) => {
      yaw = Number(event.target.value) * Math.PI / 180;
      draw();
    });
    document.getElementById("reset").addEventListener("click", () => {
      yaw = -28 * Math.PI / 180;
      pitch = 52 * Math.PI / 180;
      document.getElementById("pitch").value = "52";
      document.getElementById("yaw").value = "-28";
      fit();
    });
    document.getElementById("clear").addEventListener("click", () => {
      routeFrom = null;
      routeTo = null;
      selectedId = null;
      showSelection();
      draw();
    });

    document.getElementById("count").textContent =
      SHEET.nodes.length + " nodes on the tilted sheet";
    window.addEventListener("resize", resize);
    floor.addEventListener("load", () => {
      imgW = floor.naturalWidth;
      imgH = floor.naturalHeight;
      resize();
      fit();
    });
    if (floor.complete && floor.naturalWidth) {
      imgW = floor.naturalWidth;
      imgH = floor.naturalHeight;
      resize();
      fit();
    }
  </script>
</body>
</html>
